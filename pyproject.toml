[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zerobreak"
version = "0.1.0"
description = "Marco SDD de refactorización segura (Zero Breakage) para Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "radon>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "mutmut>=2.4",
]
testing = ["hypothesis>=6.100", "mutmut>=2.4"]

[project.scripts]
zerobreak = "zerobreak.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zerobreak"]

[tool.pytest.ini_options]
testpaths = ["test_cases", "tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["zerobreak"]

[tool.coverage.report]
show_missing = true
omit = ["*/__main__.py"]
exclude_lines = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Conjunto verificado con pycodestyle/pyflakes (equivalentes puros en Python).
select = ["E", "W", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
